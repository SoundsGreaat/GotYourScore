backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**/*.py'
          - 'alembic/**'
          - 'alembic.ini'

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/templates/**'
          - 'app/static/js/**'
          - 'app/static/css/src/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: 'README.md'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'
          - '.github/trivy-postgres-ignore.yml'
          - 'tests/ci.env'
          - 'tests/compose.yml'
