services:
  db:
    image: postgres:17-alpine
    container_name: gotyourscore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gotyourscore
    ports:
      - "5432:5432"
    volumes:
      - gotyourscore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotyourscore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gotyourscore_pgdata:
