services:
  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    container_name: gotyourscore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gotyourscore
    ports:
      - "5432:5432"
    volumes:
      - gotyourscore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotyourscore"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gotyourscore-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the DB host is the service name.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/gotyourscore
      APP_LOG_FILE: /var/log/gotyourscore/app.jsonl
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    volumes:
      - gotyourscore_logs:/var/log/gotyourscore
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  gotyourscore_pgdata:
  gotyourscore_logs:
