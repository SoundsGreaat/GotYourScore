{# Empty "view notes" modal shell shared by the review tables.
   The partial's script fills #<id>-title / #<id>-body on demand. #}
{% macro notes_modal(id) -%}
{% import "macros/icons.html" as icons %}
<dialog id="{{ id }}-notes-modal" class="modal">
    <div class="modal-box w-11/12 max-w-2xl">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Close">{{ icons.x() }}</button>
        </form>
        <h3 id="{{ id }}-notes-title" class="pr-8 text-lg font-bold"></h3>
        <div id="{{ id }}-notes-body" class="mt-3 max-h-[60vh] overflow-y-auto text-sm leading-relaxed [&_p]:my-2 [&_ul]:pl-5 [&_ul]:[list-style-type:disc] [&_ol]:pl-5 [&_ol]:[list-style-type:decimal]"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
{%- endmacro %}
