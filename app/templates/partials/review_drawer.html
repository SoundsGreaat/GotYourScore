<div class="drawer drawer-end">
    <input id="review-drawer-toggle" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content"></div>
    <div class="drawer-side">
        <label for="review-drawer-toggle" aria-label="close drawer" class="drawer-overlay"></label>
        <aside class="flex min-h-full w-[28rem] max-w-full flex-col bg-base-100">
            <div class="flex items-center justify-between border-b border-base-300 p-4">
                <h2 class="text-lg font-semibold">New Review</h2>
                <label for="review-drawer-toggle" class="btn btn-ghost btn-sm">Close</label>
            </div>

            <div class="space-y-4 overflow-y-auto p-4">

                <fieldset class="fieldset">
                    <label class="label" for="review-agent">Agent</label>
                    <button type="button" popovertarget="review-agent-menu"
                            style="anchor-name:--review-agent-anchor"
                            class="select select-sm w-full flex items-center">
                        <span id="review-agent-display" class="pointer-events-none truncate text-base-content/70">Select agent…</span>
                    </button>
                    <ul id="review-agent-menu" popover style="position-anchor:--review-agent-anchor"
                        class="dropdown menu menu-sm w-80 flex-nowrap overflow-y-auto rounded-box border border-base-300 bg-base-100 p-1 shadow-md max-h-48">
                        {% for agent in agents %}
                        <li>
                            <button type="button" onclick="updateCustomDropdown('review-agent', 'review-agent-display', '{{ agent.id }}', '{{ agent.name }}', this)">
                                {{ agent.name }}
                            </button>
                        </li>
                        {% endfor %}
                    </ul>
                    <input type="hidden" id="review-agent" value="" />
                </fieldset>

                <fieldset class="fieldset">
                    <label class="label" for="case-number">Case number</label>
                    <input id="case-number" type="text" class="input input-sm w-full" placeholder="CASE-1234" />
                </fieldset>

                <fieldset class="fieldset">
                    <label class="label" for="case-type">Case type</label>
                    <button type="button" popovertarget="case-type-menu"
                            style="anchor-name:--case-type-anchor"
                            class="select select-sm w-full flex items-center">
                        <span id="case-type-display" class="pointer-events-none truncate">Service Request</span>
                    </button>
                    <ul id="case-type-menu" popover style="position-anchor:--case-type-anchor"
                        class="dropdown menu menu-sm w-64 flex-nowrap overflow-y-auto rounded-box border border-base-300 bg-base-100 p-1 shadow-md max-h-48">
                        {% for case_type in case_types %}
                        <li>
                            <button type="button"
                                    onclick="updateCustomDropdown('case-type', 'case-type-display', '{{ case_type }}', '{{ case_type }}', this)"
                                    class="{% if case_type == 'Service Request' %}active{% endif %}">
                                {{ case_type }}
                            </button>
                        </li>
                        {% endfor %}
                    </ul>
                    <input type="hidden" id="case-type" value="Service Request" />
                </fieldset>

                <fieldset class="fieldset">
                    <span class="label">Review notes</span>
                    <div class="overflow-hidden rounded-box border border-base-300 bg-base-100">
                        <!-- ql-container/ql-snow must ship in the markup: HTMX's settle step
                             re-applies server attributes after Quill init and would strip
                             runtime-added classes, un-hiding the snow theme's link tooltip. -->
                        <div id="quill-editor" class="min-h-48 ql-container ql-snow"></div>
                    </div>
                </fieldset>

                <fieldset class="fieldset">
                    <span class="label">Scorecard</span>
                    <!-- min-w-0: daisyUI v5 .fieldset is a grid, and without it the
                         auto track grows to the longest rule name (truncate never
                         kicks in), stretching the whole page horizontally. -->
                    <div id="manual-score-area" class="min-w-0 rounded-box border border-base-300 bg-base-100 p-3 text-sm text-base-content/70 min-h-12">Loading…</div>
                    <p class="text-xs text-base-content/60">Tick violations; lower the points for a partial deduction.</p>
                </fieldset>

                <div id="ai-score-result" class="card hidden bg-base-200 shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-base">Score preview</h3>
                        <div id="ai-score-content"></div>
                    </div>
                </div>

                <button id="save-review" type="button" class="btn btn-primary btn-block" disabled>Save Review</button>
            </div>
        </aside>
    </div>
</div>

<ul id="ai-context-menu"
    class="menu menu-sm absolute z-[100] hidden w-52 origin-top-left animate-menu-pop rounded-box border border-base-300 bg-base-100 p-1 shadow-md">
    <li>
        <button id="ai-refactor-action" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
            </svg>
            Refactor Notes
        </button>
    </li>
    <li>
        <button id="ai-score-action" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
            </svg>
            Generate Score
        </button>
    </li>
    <li>
        <button id="score-notes-action" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            Score → Notes
        </button>
    </li>
    <li>
        <button id="copy-all-action" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
            </svg>
            Copy All
        </button>
    </li>
</ul>

<script>
window.updateCustomDropdown = function(inputId, displayId, value, text, buttonElement) {
    document.getElementById(inputId).value = value;
    var displaySpan = document.getElementById(displayId);
    displaySpan.textContent = text;
    displaySpan.classList.remove('text-base-content/70');

    if (buttonElement) {
        var siblings = buttonElement.closest('ul').querySelectorAll('button');
        siblings.forEach(function(btn) { btn.classList.remove('active'); });
        buttonElement.classList.add('active');
    }

    // Popover-API menus stay open after an inner click — close on pick.
    var pop = buttonElement && buttonElement.closest('[popover]');
    if (pop && pop.matches(':popover-open')) pop.hidePopover();

    document.dispatchEvent(new CustomEvent('review-agent-change'));
    if (inputId === 'case-type') document.dispatchEvent(new CustomEvent('case-type-change'));
};

(function () {
    var editorContainer = document.getElementById('quill-editor');
    var menu = document.getElementById('ai-context-menu');

    var drawerToggle = document.getElementById('review-drawer-toggle');
    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            drawerToggle.checked = true;
        });
    });

    if (!editorContainer || !menu || !window.Quill) return;

    if (window._reviewDrawerCleanup) window._reviewDrawerCleanup();
    if (window._reviewDrawerAbort) window._reviewDrawerAbort.abort();
    var controller = new AbortController();
    window._reviewDrawerAbort = controller;
    var drawerMount = editorContainer.closest('.drawer').parentElement;
    var draftKey = 'gotyourscore:review-draft:new';
    var draftTimer;
    var pendingDeductions;
    var quill;

    function showToast(message, kind) {
        var toast = document.createElement('div');
        toast.setAttribute('role', 'alert');
        toast.className = 'alert ' + (kind || 'alert-error') + ' fixed bottom-4 right-4 z-50 w-auto max-w-sm shadow-lg';
        toast.textContent = message;
        document.body.appendChild(toast);
        window.setTimeout(function () { toast.remove(); }, 3500);
    }

    function sanitizeHtml(html) {
        return window.DOMPurify ? window.DOMPurify.sanitize(html) : html;
    }

    var menuOpenedAt = 0;
    function hideMenu(force) {
        if (!force && Date.now() - menuOpenedAt < 250) return;
        menu.classList.add('hidden');
    }
    function setLoading(button, label, loading) {
        button.disabled = loading;
        if (loading) {
            button.textContent = label;
            button.insertAdjacentHTML('beforeend', ' <span class="loading loading-spinner loading-xs"></span>');
        } else {
            button.innerHTML = button.dataset.labelHtml;
        }
    }

    function escapeHtml(value) {
        var element = document.createElement('span');
        element.textContent = value;
        return element.innerHTML;
    }

    function saveDraft() {
        window.clearTimeout(draftTimer);
        draftTimer = window.setTimeout(function () {
            try {
                var pristine = !quill.getText().trim()
                    && !document.getElementById('review-agent').value
                    && !document.getElementById('case-number').value
                    && document.getElementById('case-type').value === 'Service Request'
                    && Object.keys(collectDeductions()).length === 0;
                if (pristine) {
                    window.localStorage.removeItem(draftKey);
                } else {
                    window.localStorage.setItem(draftKey, JSON.stringify({
                        v: 1,
                        notes_html: sanitizeHtml(quill.root.innerHTML),
                        agent_id: document.getElementById('review-agent').value,
                        agent_name: document.getElementById('review-agent-display').textContent,
                        case_number: document.getElementById('case-number').value,
                        case_type: document.getElementById('case-type').value,
                        deductions: collectDeductions()
                    }));
                }
            } catch (error) {
                // Storage can be unavailable in private browsing or restricted frames.
            }
        }, 300);
    }

    function loadDraft() {
        var raw = null;
        try { raw = window.localStorage.getItem(draftKey); } catch (error) { return null; }
        if (!raw) return null;
        try {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
        } catch (error) {
            // Drafts written before v1 stored the bare notes HTML string.
        }
        return { notes_html: raw };
    }

    function clearDraft() {
        window.clearTimeout(draftTimer);
        try { window.localStorage.removeItem(draftKey); } catch (error) { }
    }

    function cleanup() {
        window.clearTimeout(draftTimer);
        window.clearTimeout(previewTimer);
        if (quill) {
            quill.off('text-change', saveDraft);
            // Do NOT call quill.disable() here: its ql-disabled class leaks onto the
            // replacement #quill-editor via HTMX's cloneAttributes.
            var clipboard = editorContainer.querySelector('.ql-clipboard');
            if (clipboard) clipboard.remove();
            quill = null;
        }
        if (window._reviewDrawerCleanup === cleanup) window._reviewDrawerCleanup = null;
    }

    window._reviewDrawerCleanup = cleanup;
    document.addEventListener('htmx:beforeSwap', function (event) {
        if (event.detail && event.detail.target === drawerMount) cleanup();
    }, { signal: controller.signal });

    quill = window.Quill.find(editorContainer);
    if (!quill) quill = new window.Quill(editorContainer, {
        theme: 'snow',
        modules: { toolbar: [['bold', 'italic', 'underline'], [{ color: [] }], ['image', 'code-block']] }
    });
    var draft = loadDraft();
    if (draft && draft.notes_html && !quill.getText().trim()) {
        quill.clipboard.dangerouslyPasteHTML(sanitizeHtml(draft.notes_html), 'silent');
    }
    if (draft) {
        if (draft.agent_id) {
            document.getElementById('review-agent').value = draft.agent_id;
            var agentDisplay = document.getElementById('review-agent-display');
            agentDisplay.textContent = draft.agent_name || '';
            agentDisplay.classList.remove('text-base-content/70');
            document.querySelectorAll('#review-agent-menu button').forEach(function (btn) {
                if (btn.textContent.trim() === draft.agent_name) btn.classList.add('active');
            });
        }
        document.getElementById('case-number').value = draft.case_number || '';
        if (draft.case_type) {
            document.getElementById('case-type').value = draft.case_type;
            document.getElementById('case-type-display').textContent = draft.case_type;
            document.querySelectorAll('#case-type-menu button').forEach(function (btn) {
                btn.classList.toggle('active', btn.textContent.trim() === draft.case_type);
            });
        }
        if (draft.deductions && typeof draft.deductions === 'object') pendingDeductions = draft.deductions;
    }
    quill.on('text-change', saveDraft);

    var refactorButton = document.getElementById('ai-refactor-action');
    var scoreButton = document.getElementById('ai-score-action');
    var notesButton = document.getElementById('score-notes-action');
    var saveButton = document.getElementById('save-review');
    refactorButton.dataset.labelHtml = refactorButton.innerHTML;
    scoreButton.dataset.labelHtml = scoreButton.innerHTML;
    notesButton.dataset.labelHtml = notesButton.innerHTML;
    saveButton.dataset.labelHtml = saveButton.innerHTML;

    function updateSaveState() {
        saveButton.disabled = !document.getElementById('review-agent').value;
    }
    document.addEventListener('review-agent-change', updateSaveState, { signal: controller.signal });
    document.addEventListener('review-agent-change', saveDraft, { signal: controller.signal });
    updateSaveState();

    var rulesArea = document.getElementById('manual-score-area');

    async function loadCaseRules() {
        var value = document.getElementById('case-type').value;
        if (!value || value === 'No Cases') {
            pendingDeductions = null;
            rulesArea.innerHTML = '<p class="text-sm text-base-content/60">No scorecard for this case type.</p>';
            renderPreview(null);
            return;
        }
        rulesArea.innerHTML = '<span class="loading loading-spinner loading-sm"></span>';
        try {
            var response = await fetch('/partials/case-rules?case_type=' + encodeURIComponent(value), { credentials: 'same-origin' });
            if (!response.ok) throw new Error('Case rules request failed');
            rulesArea.innerHTML = await response.text();
        } catch (error) {
            rulesArea.innerHTML = '<p class="text-sm text-base-content/60">No scorecard for this case type.</p>';
        }
        if (pendingDeductions) {
            Object.entries(pendingDeductions).forEach(function (entry) {
                var box = rulesArea.querySelector('input[data-error-name="' + CSS.escape(entry[0]) + '"]');
                if (!box) return;
                box.checked = true;
                var deduction = box.closest('[data-rule-row]').querySelector('[data-deduction]');
                if (deduction) {
                    deduction.disabled = false;
                    deduction.value = String(entry[1]);
                }
            });
            pendingDeductions = null;
        }
        recalcScore();
    }

    function collectDeductions() {
        var deductions = {};
        rulesArea.querySelectorAll('input[data-error-name]:checked').forEach(function (box) {
            var deduction = box.closest('[data-rule-row]').querySelector('[data-deduction]');
            var penalty = Number(box.dataset.penalty);
            var pts = parseInt(deduction && deduction.value, 10);
            if (isNaN(pts)) pts = penalty;
            // Partial deductions: clamp the typed value to 1..penalty.
            deductions[box.dataset.errorName] = Math.min(Math.max(pts, 1), penalty);
        });
        return deductions;
    }

    var previewTimer;
    // Monotonic token: only the LATEST recalcScore may render, otherwise a
    // slow earlier request (e.g. the zero-deduction call fired right after
    // the rules fragment loads) can resolve late and overwrite a newer,
    // correct preview.
    var previewSeq = 0;

    function schedulePreview() {
        window.clearTimeout(previewTimer);
        previewTimer = window.setTimeout(recalcScore, 400);
    }

    async function recalcScore() {
        var seq = ++previewSeq;
        var deductions = collectDeductions();
        var agentId = document.getElementById('review-agent').value;
        var caseType = document.getElementById('case-type').value;
        if (!agentId || caseType === 'No Cases' || !rulesArea.querySelector('[data-error-name]')) {
            if (seq === previewSeq) renderPreview(null);
            return;
        }
        try {
            var response = await fetch('/api/reviews/score-preview', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    support_agent_id: Number(agentId),
                    case_type: caseType,
                    raw_scorecard: deductions
                })
            });
            if (!response.ok) throw new Error('Score preview failed');
            var data = await response.json();
            if (seq === previewSeq) renderPreview(data);
        } catch (error) {
            if (seq === previewSeq) renderPreview(null);
        }
    }

    function renderPreview(data) {
        var panel = document.getElementById('ai-score-result');
        var content = document.getElementById('ai-score-content');
        if (!data) {
            panel.classList.add('hidden');
            content.innerHTML = '';
            return;
        }
        var multipliers = Object.entries(data.breakdown || {})
            .filter(function (entry) { return Number(entry[1].multiplier) > 1; })
            .map(function (entry) { return escapeHtml(entry[0]) + ' ×' + escapeHtml(String(entry[1].multiplier)); })
            .join(', ');
        content.innerHTML =
            '<p class="text-3xl font-bold text-primary">' + escapeHtml(String(data.final_score)) + '</p>' +
            '<p class="mt-1 text-sm text-base-content/70">Total deduction: ' + escapeHtml(String(data.total_penalty)) + '</p>' +
            (multipliers ? '<p class="mt-2 text-xs text-base-content/60">' + multipliers + '</p>' : '');
        panel.classList.remove('hidden');
    }

    document.addEventListener('case-type-change', loadCaseRules, { signal: controller.signal });
    document.addEventListener('case-type-change', saveDraft, { signal: controller.signal });
    document.addEventListener('review-agent-change', schedulePreview, { signal: controller.signal });
    document.addEventListener('review-agent-change', saveDraft, { signal: controller.signal });
    document.getElementById('case-number').addEventListener('input', saveDraft);
    rulesArea.addEventListener('change', function (event) {
        if (event.target.matches && event.target.matches('input[data-error-name]')) {
            // Enable the points input only while the violation is ticked.
            var deduction = event.target.closest('[data-rule-row]').querySelector('[data-deduction]');
            deduction.disabled = !event.target.checked;
            if (event.target.checked && !deduction.value) deduction.value = event.target.dataset.penalty;
        }
        schedulePreview();
        saveDraft();
    }, { signal: controller.signal });
    loadCaseRules();

    editorContainer.addEventListener('contextmenu', function (event) {
        if (!event.target.closest('.ql-editor')) return;
        event.preventDefault();
        menuOpenedAt = Date.now();
        menu.classList.remove('hidden');
        var left = Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 8);
        var top = Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 8);
        menu.style.left = Math.max(8, left + window.scrollX) + 'px';
        menu.style.top = Math.max(8, top + window.scrollY) + 'px';
    });

    menu.addEventListener('click', function (event) { event.stopPropagation(); });
    document.addEventListener('click', function (event) {
        if (Date.now() - menuOpenedAt < 200) return;
        hideMenu();
    }, { signal: controller.signal });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape') hideMenu(); }, { signal: controller.signal });
    window.addEventListener('scroll', function (event) {
        var target = event.target;
        if (target instanceof Element && target.closest('.drawer-content')) return;
        hideMenu();
    }, { capture: true, signal: controller.signal });

    refactorButton.addEventListener('click', async function () {
        setLoading(refactorButton, 'Refactoring…', true);
        try {
            var response = await fetch('/api/ai/refactor', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: quill.root.innerHTML })
            });
            if (!response.ok) throw new Error('Refactor request failed');
            quill.root.innerHTML = sanitizeHtml((await response.json()).html);
            saveDraft();
            hideMenu(true);
        } catch (error) {
            showToast('Unable to refactor notes.');
        } finally {
            setLoading(refactorButton, 'Refactoring…', false);
        }
    });

    scoreButton.addEventListener('click', async function () {
        setLoading(scoreButton, 'Scoring…', true);
        try {
            var response = await fetch('/api/ai/score', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: quill.root.innerHTML, case_type: document.getElementById('case-type').value })
            });
            if (!response.ok) throw new Error('Score request failed');
            var result = await response.json();
            var matched = 0;
            Object.entries(result.scorecard || {}).forEach(function (entry) {
                if (Number(entry[1]) <= 0) return;
                var box = rulesArea.querySelector('input[data-error-name="' + CSS.escape(entry[0]) + '"]');
                if (box) {
                    box.checked = true;
                    var row = box.closest('[data-rule-row]');
                    var deduction = row.querySelector('[data-deduction]');
                    if (deduction) {
                        deduction.disabled = false;
                        if (!deduction.value) deduction.value = box.dataset.penalty;
                    }
                    matched += 1;
                }
            });
            if (!matched) showToast('No matching scorecard rules for the AI findings.');
            hideMenu(true);
            window.clearTimeout(previewTimer);
            recalcScore();
        } catch (error) {
            showToast('Unable to generate a score.');
        } finally {
            setLoading(scoreButton, 'Scoring…', false);
        }
    });

    document.getElementById('copy-all-action').addEventListener('click', function () {
        var source = quill.root; // the .ql-editor element
        var selection = window.getSelection();
        if (!selection) return;
        selection.removeAllRanges();
        var range = document.createRange();
        range.selectNodeContents(source);
        selection.addRange(range);
        var copied = false;
        try { copied = document.execCommand('copy'); } catch (error) { copied = false; }
        selection.removeAllRanges();
    if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(source.innerText).then(function () {
            showToast('Copied to clipboard.', 'alert-success');
        }, function () { showToast('Unable to copy.'); });
    } else {
        showToast(copied ? 'Copied to clipboard.' : 'Unable to copy.',
                  copied ? 'alert-success' : undefined);
    }
        hideMenu(true);
    });

    document.getElementById('score-notes-action').addEventListener('click', async function () {
        var button = this;
        hideMenu(true);
        setLoading(button, 'Drafting…', true);
        try {
            var response = await fetch('/api/ai/notes-from-score', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    case_type: document.getElementById('case-type').value,
                    raw_scorecard: collectDeductions()
                })
            });
            var data = await response.json().catch(function () { return {}; });
            if (!response.ok) throw new Error(data.detail || 'AI note drafting failed');
            var clean = DOMPurify.sanitize(data.notes_html || '', { ALLOWED_TAGS: ['p','ul','ol','li','strong','em','br'], KEEP_CONTENT: true });
            if (!clean.trim()) throw new Error('The AI returned an empty note');
            quill.deleteText(0, quill.getLength());
            quill.clipboard.dangerouslyPasteHTML(0, clean);
            quill.setSelection(quill.getLength());
        saveDraft();
        showToast('Notes drafted from the current score.', 'alert-success');
        } catch (error) {
            showToast(error.message || 'AI note drafting failed');
        } finally {
            setLoading(button, '', false);
        }
    });

    saveButton.addEventListener('click', async function () {
        if (!document.getElementById('review-agent').value) return;
        setLoading(saveButton, 'Saving…', true);
        try {
            var response = await fetch('/api/reviews', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    support_agent_id: Number(document.getElementById('review-agent').value),
                    case_type: document.getElementById('case-type').value,
                    case_number: document.getElementById('case-number').value || null,
                    notes: sanitizeHtml(quill.root.innerHTML),
                    raw_scorecard: collectDeductions()
                })
            });
            if (!response.ok) throw new Error('Review save failed');
            clearDraft();
            document.body.dispatchEvent(new CustomEvent('reviews-changed', { bubbles: true }));
            showToast('Review saved.', 'alert-success');
            document.getElementById('review-drawer-toggle').checked = false;
        } catch (error) {
            showToast('Unable to save review.');
        } finally {
            setLoading(saveButton, 'Saving…', false);
            updateSaveState();
        }
    });
})();
</script>
