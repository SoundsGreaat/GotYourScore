<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}GotYourScore{% endblock %}</title>

    <link rel="icon" href="/static/favicon.ico" sizes="32x32"/>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"/>

    <!-- Set the theme before first paint to avoid a flash of the wrong theme. -->
    <script>
        (function () {
            var stored = null;
            try {
                stored = localStorage.getItem('theme');
            } catch (e) { /* storage blocked */
            }
            var theme = (stored === 'light' || stored === 'dark')
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <!-- Tailwind v4 + daisyUI v5 + Quill snow CSS + Inter Variable font,
         all compiled into one bundle by `npm run build`
         (source: app/static/css/src/input.css). No CDN dependencies. -->
    <link href="/static/css/app.css" rel="stylesheet"/>

    <!-- Theme toggle wiring for every [data-theme-toggle] checkbox;
         delegated, so it works on HTMX-swapped markup without re-binding. -->
    <script>
        // .toggle-on mirrors :checked on the .toggle wrapper: Chromium skips
        // transitions for :has()-invalidated changes, so the slider needs a
        // class-driven state to glide (see .toggle.toggle-on in input.css).
        function syncThemeToggles() {
            var dark = document.documentElement.dataset.theme === 'dark';
            document.querySelectorAll('[data-theme-toggle]').forEach(function (cb) {
                cb.checked = dark;
                var wrap = cb.closest('.toggle');
                if (wrap) wrap.classList.toggle('toggle-on', dark);
            });
        }
        function applyTheme(theme) {
            var root = document.documentElement;
            var set = function () { root.dataset.theme = theme; };
            // Reduced-motion preference wins over everything: instant swap.
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                set();
                return;
            }
            if (document.startViewTransition) {
                // Compositor crossfade of full-page snapshots: smooth even
                // where per-element color transitions across the whole
                // document would tank the frame rate (Chrome). Atomic by
                // design — every pixel changes inside one snapshot pair.
                document.startViewTransition(set);
                return;
            }
            // No View Transitions (e.g. current Firefox): glide ALL
            // surfaces together behind a short-lived flag so nothing
            // animates alone against an instant swap (.gys-theme-fade
            // in input.css). Flag FIRST, flip the palette NEXT FRAME:
            // landing both in one style recalc makes Chromium skip
            // the transition (before-change style had none).
            root.classList.add('gys-theme-fade');
            requestAnimationFrame(function () { set(); });
            window.setTimeout(function () { root.classList.remove('gys-theme-fade'); }, 400);
        }
        var pendingThemeTimer = null;
        document.addEventListener('change', function (event) {
            var cb = event.target.closest('[data-theme-toggle]');
            if (!cb) return;
            var theme = cb.checked ? 'dark' : 'light';
            var wrap = cb.closest('.toggle');
            if (wrap) wrap.classList.toggle('toggle-on', cb.checked);
            // Let the thumb FINISH its live glide before the palette
            // crossfade: snapshots taken mid-slide would ghost it between
            // two static positions instead of showing movement. By VT
            // start the thumb rests at its final spot in both snapshots.
            // Reduced-motion users get NO thumb glide, so they need no
            // pre-slide wait either — apply immediately.
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            clearTimeout(pendingThemeTimer);
            if (reduce) {
                applyTheme(theme);
            } else {
                pendingThemeTimer = setTimeout(function () { applyTheme(theme); }, 210);
            }
            try { localStorage.setItem('theme', theme); } catch (e) { /* storage blocked */ }
        });
        document.addEventListener('DOMContentLoaded', syncThemeToggles);
    </script>

    <!-- All runtime JS below is vendored from npm (scripts/vendor.mjs). -->
    <script src="/static/js/vendor/htmx.min.js"></script>

    <!-- Native-select-style keyboard support (typeahead, arrows, Enter)
         for every [popover].dropdown.menu, incl. HTMX-swapped content. -->
    <script defer src="/static/js/dropdowns.js"></script>

    <!-- Shared partial helpers (toast, drawer handoff, escaping). -->
    <script defer src="/static/js/common.js"></script>

    <!-- "View notes" modal: one document-level click delegation opens the
         shared .js-notes-modal from any [data-case-notes] trigger. -->
    <script defer src="/static/js/notes_modal.js"></script>

    <!-- Sliding-underline tab strips ([data-tabs]): dashboard tracker,
         admin panel. Deferred so a hash-restored tab can retarget the
         eager load before htmx initializes. -->
    <script defer src="/static/js/tabs.js"></script>

    <!-- Quill 2: the full build registers the snow theme (there is no separate
         themed JS bundle). Loaded once so HTMX-swapped partials can initialize
         the editor without dynamic script injection. -->
    <script src="/static/js/vendor/quill.js"></script>
    <script src="/static/js/vendor/purify.min.js"></script>

    <!-- SortableJS: drag-and-drop reordering for the scorecard rule editor.
         Loaded once so HTMX-swapped partials can initialize lists without
         dynamic script injection. -->
    <script src="/static/js/vendor/Sortable.min.js"></script>
</head>

<body class="min-h-screen bg-base-200 text-base-content">
{% block content %}{% endblock %}
</body>
</html>
