<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}GotYourScore{% endblock %}</title>

    <link rel="icon" href="/static/favicon.ico?v={{ asset_v }}" sizes="32x32"/>
    <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml"/>

    <meta name="color-scheme" content="light dark"/>
    <!-- Apply the browser scheme and the brand palette before first paint. -->
    <script>
        (function () {
            var scheme = document.querySelector('meta[name="color-scheme"]');
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') scheme.content = stored;
            } catch (e) { /* storage blocked */ }
            document.documentElement.dataset.theme = scheme.content === 'light dark'
                ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : scheme.content;
        })();
    </script>

    <!-- Tailwind v4 + daisyUI v5 + Quill snow CSS + Inter Variable font,
         all compiled into one bundle by `npm run build`
         (source: app/static/css/src/input.css). No CDN dependencies. -->
    <link href="/static/css/app.css?v={{ asset_v }}" rel="stylesheet"/>

    <script defer src="/static/js/theme.js?v={{ asset_v }}"></script>

    <!-- All runtime JS below is vendored from npm (scripts/vendor.mjs). -->
    <!-- Failed requests must not replace the view. The dashboard owns its
         hash, and full-page navigation uses the browser's history. -->
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"],"history":false}' />
    <script src="/static/js/vendor/htmx.min.js?v={{ asset_v }}"></script>

    <!-- Shared dropdown search and keyboard support, including swapped content. -->
    <script defer src="/static/js/dropdowns.js?v={{ asset_v }}"></script>

    <!-- Shared partial helpers (toast, drawer handoff, escaping). -->
    <script defer src="/static/js/modals.js?v={{ asset_v }}"></script>
    <script defer src="/static/js/common.js?v={{ asset_v }}"></script>
    <!-- Streaming AI insertion: token-by-token reveal into Quill for the
         /api/ai/*/stream NDJSON endpoints (drawer Refactor/Score->Notes,
         Bad Feedback comment refactor). -->
    <script defer src="/static/js/ai_stream.js?v={{ asset_v }}"></script>
    <!-- Rich-comment editor module (Quill + AI Refactor + Copy All/HTML):
         shared by the Bad Feedback record editor, reusable for future
         record kinds (Refund Check). -->
    <script defer src="/static/js/comment_editor.js?v={{ asset_v }}"></script>
    <!-- "View notes" modal: one document-level click delegation opens the
         shared .js-notes-modal from any [data-case-notes] trigger. -->
    <script defer src="/static/js/notes_modal.js?v={{ asset_v }}"></script>

    <!-- Sliding-underline tab strips ([data-tabs]): dashboard tracker,
         admin panel. Deferred so a hash-restored tab can retarget the
         eager load before htmx initializes. -->
    <script defer src="/static/js/tabs.js?v={{ asset_v }}"></script>

    <!-- Dashboard sidebar view engine: hash-synced view + reporting-period
         state for #view-container swaps. Deferred so it runs after parsing
         but before htmx's initial load-trigger fetch. -->
    <script defer src="/static/js/dashboard.js?v={{ asset_v }}"></script>

    <!-- Quill 2: the full build registers the snow theme (there is no separate
         themed JS bundle). Loaded once so HTMX-swapped partials can initialize
         the editor without dynamic script injection. -->
    <script src="/static/js/vendor/quill.js?v={{ asset_v }}"></script>
    <script src="/static/js/vendor/purify.min.js?v={{ asset_v }}"></script>

    <!-- SortableJS: shared drag-and-drop reordering for admin lists.
         Loaded once so HTMX-swapped partials can initialize lists without
         dynamic script injection. -->
    <script src="/static/js/vendor/Sortable.min.js?v={{ asset_v }}"></script>
</head>

<body class="min-h-screen bg-base-200 text-base-content">
{% block content %}{% endblock %}
{% import "macros/modals.html" as modals %}
{{ modals.confirm_dialog() }}
</body>
</html>
