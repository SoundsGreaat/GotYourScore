{# Admin panel shell. Context: current_user=User. Tabs swap HTMX
   partials into #admin-view; the Prompts tab loads eagerly. #}
{% extends "base.html" %}

{% block title %}Administration · GotYourScore{% endblock %}

{% block content %}
<main class="container mx-auto max-w-6xl p-4 md:p-6" x-data="{ tab: 'prompts' }">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold">Administration</h1>
        <a href="/" class="btn btn-ghost btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to dashboard
        </a>
    </div>

    <div role="tablist" class="tabs tabs-box">
        <button type="button" role="tab" class="tab" :class="tab === 'prompts' && 'tab-active'" :aria-selected="tab === 'prompts'"
                @click="tab = 'prompts'; htmx.ajax('GET', '/admin/partials/prompts', '#admin-view')">Prompts</button>
        <button type="button" role="tab" class="tab" :class="tab === 'scorecards' && 'tab-active'" :aria-selected="tab === 'scorecards'"
                @click="tab = 'scorecards'; htmx.ajax('GET', '/admin/partials/scorecards', '#admin-view')">Scorecards</button>
        <button type="button" role="tab" class="tab" :class="tab === 'roles' && 'tab-active'" :aria-selected="tab === 'roles'"
                @click="tab = 'roles'; htmx.ajax('GET', '/admin/partials/roles', '#admin-view')">Roles</button>
        <button type="button" role="tab" class="tab" :class="tab === 'deleted-reviews' && 'tab-active'" :aria-selected="tab === 'deleted-reviews'"
                @click="tab = 'deleted-reviews'; htmx.ajax('GET', '/admin/partials/deleted-reviews', '#admin-view')">Deleted Reviews</button>
    </div>

    <div id="admin-view" class="mt-5" hx-get="/admin/partials/prompts" hx-trigger="load" hx-swap="innerHTML"></div>
</main>

<script>
    if (!window.__adminDropdownInit) {
        window.__adminDropdownInit = true;
        window.adminSetDropdown = function (hiddenId, displayId, value, text, btnEl) {
            var hidden = document.getElementById(hiddenId);
            if (hidden) hidden.value = value;
            var display = document.getElementById(displayId);
            if (display) {
                display.textContent = text;
                display.classList.remove('text-base-content/70');
            }
            if (btnEl) {
                var siblings = btnEl.closest('ul').querySelectorAll('button');
                siblings.forEach(function (btn) { btn.classList.remove('active'); });
                btnEl.classList.add('active');
            }
            // Popover-API dropdowns stay open after an inner click — close it.
            var pop = btnEl && btnEl.closest('[popover]');
            if (pop && pop.matches(':popover-open')) pop.hidePopover();
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        };
    }
</script>
{% endblock %}
